name: DevSecOps Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast-semgrep:
    name: SAST - Semgrep Code Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Instalar Semgrep
        run: |
          python3 -m venv /tmp/semgrep-venv
          /tmp/semgrep-venv/bin/pip install semgrep

      - name: Ejecutar analisis SAST
        run: |
          /tmp/semgrep-venv/bin/semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --sarif \
            --output semgrep-results.sarif

      - name: Subir reporte SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif-report
          path: semgrep-results.sarif
          if-no-files-found: error

  sca-and-sbom:
    name: SCA - SBOM CycloneDX
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Generar SBOM con Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Subir artefacto SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          if-no-files-found: error

  sca-dependency-check:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Restaurar cache de Dependency-Check
        uses: actions/cache@v4
        with:
          path: dependency-check-data
          key: dependency-check-nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-nvd-${{ runner.os }}-

      - name: Preparar entorno para Dependency-Check
        run: |
          mkdir -p reports dependency-check-data
          npm ci --ignore-scripts

          echo "Asignando permisos al usuario del contenedor..."
          sudo chown -R 1000:1000 reports dependency-check-data

          echo "Usuario del runner:"
          id

          echo "Permisos de los directorios:"
          ls -ld reports dependency-check-data

          echo "Dependencias instaladas:"
          test -d node_modules && echo "node_modules existe"

      - name: Validar escritura del contenedor
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            -v "${{ github.workspace }}/reports:/report" \
            -v "${{ github.workspace }}/dependency-check-data:/usr/share/dependency-check/data" \
            owasp/dependency-check:latest \
            -c 'set -e; id; touch /report/prueba-permisos.txt /usr/share/dependency-check/data/prueba-permisos.txt; rm /report/prueba-permisos.txt /usr/share/dependency-check/data/prueba-permisos.txt'

      - name: Ejecutar OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          docker run --rm \
            -e NVD_API_KEY \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ github.workspace }}/reports:/report" \
            -v "${{ github.workspace }}/dependency-check-data:/usr/share/dependency-check/data" \
            owasp/dependency-check:latest \
            --project "NodeGoat" \
            --scan /src \
            --out /report \
            --format HTML \
            --format JSON \
            --disableNodeAudit \
            --nvdApiKey "$NVD_API_KEY" \
            --nvdApiDelay 6000 \
            --failOnCVSS 7

      - name: Subir reportes SCA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
          if-no-files-found: warn
